<!DOCTYPE html> <!-- serve para indicar a linguagem de programação.--> 
<html lang="pt-br"> <!--abertura dos códigos, delimita o documento. Todos os códigos\tags da página devem estar dentro desse espaço.-->
<head> <!--define o cabeçalho do documento. Destro dessa tag pode ser inseridas folhas de estilo e script.-->
    <meta charset="UTF-8"> <!-- indica qual será os caracteres (character set ou charset) será utilizado para renderizar o texto da página.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--fornece metadados sobre a sua página web para navegadores e mecanismos de busca.-->
    <title>Portfólio</title> <!-- título do projeto.-->
</head> <!--fechamento da tag do cabeçalho.-->
<body> <!-- abertura da tag, marcado o espaço no qual deve estar contido o conteúdo visual da página. As demais tags que representam texto, botões e etc. devem ser adicionados nesse intervalo.\-->
    <!--Um documento HTML é composto por tags que sãos escritas entre < >. as tags precisam ser abertas e fechadas, o que as diferenciam é que as tags de fechamento possuem uma \ antes do nome. Alguns códigos não precisam da <\> para fechamento, apenas da barra no final, como o caso da tag meta. Outro aspecto importante da linguagem é que ela é case insensitive, ou seja, não leva em consideração a diferença entre letras oficiais e minúsculas. -->
<!-- No HTML há seis níveis de cabeçalho\títulos que podem ser usados por meio das tags, h1, h2, h3, h4, h5 e o h6, sendo o h1 o maior e mais relevante e o h6 o menor\menos relevante. -->
 <h1>Matemática</h1>
 <h2>Grandezas</h2>
 <h3>Unidades de medidas</h3>
 <h4>Comprimento</h4>
 <h5>Metros</h5>
 <h6>Múltiplos e Submúltiplos</h6>
</body> <!-- fechamento da tag do corpo do projeto.-->
</html><!--fechamento da tag-->
